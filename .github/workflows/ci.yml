name: CI/CD Pipeline - SRE LLM Assistant

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v

  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure kernel parameters for OpenSearch
        run: |
          sudo sysctl -w vm.max_map_count=262144
          echo "vm.max_map_count=$(sysctl -n vm.max_map_count)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare env
        run: cp .env.example .env

      - name: Start infrastructure via Docker Compose
        run: |
          set -a
          source .env
          set +a
          docker compose up -d --build opensearch ollama sre-api
          echo "Waiting for containers..."
          for i in $(seq 1 60); do
            if curl -sf "${ES_HOST_LOCAL}/_cluster/health" >/dev/null \
               && curl -sf "${API_URL}/health" >/dev/null; then
              echo "OpenSearch and API are ready"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Pull ollama model
        run: |
          set -a
          source .env
          set +a
          docker exec ollama ollama pull "${OLLAMA_MODEL}"

      - name: Setup OpenSearch index template
        run: |
          set -a
          source .env
          set +a
          ES_HOST="${ES_HOST_LOCAL}" bash scripts/setup_opensearch.sh

      - name: Seed logs into OpenSearch
        run: |
          set -a
          source .env
          set +a
          ES_HOST="${ES_HOST_LOCAL}" python scripts/seed_logs.py

      - name: Test API health
        run: |
          set -a
          source .env
          set +a
          curl -sf "${API_URL}/health" | tee /tmp/health.json
          test "$(jq -r .status /tmp/health.json)" = "healthy"

      - name: Test analyze endpoint
        run: |
          set -a
          source .env
          set +a
          curl -sf --max-time "${LLM_TIMEOUT_SECONDS}" -X POST "${API_URL}/api/v1/analyze" \
            -H "Content-Type: application/json" \
            -d '{"hours": 1, "limit": 10}' | tee /tmp/analyze.json
          jq -e '.logs_analyzed >= 1' /tmp/analyze.json
          jq -e '.remediation.issues | type == "array"' /tmp/analyze.json
          jq -e '.remediation.summary | type == "string"' /tmp/analyze.json
          jq -e '.remediation.priority_order | type == "array"' /tmp/analyze.json

      - name: Cleanup infrastructure
        if: always()
        run: docker compose down -v

  build-and-push:
    name: Build and push image
    needs: [unit-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner}/${repo}/sre-api"
          echo "image=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${GITHUB_SHA},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [build-and-push, integration-smoke]
    if: github.event_name != 'pull_request' && vars.DEPLOY_PATH != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          SRE_API_IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          envs: SRE_API_IMAGE,GHCR_TOKEN,GHCR_USER,DEPLOY_PATH,BRANCH
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-$HOME/sre-llm-assistant}"
            git fetch origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            bash scripts/deploy.sh
