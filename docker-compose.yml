services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: opensearch
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${ES_PASS:-Admin_Pass123!}"
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./infra/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    networks: [sre-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_SSL_ENABLED=false
    ports:
      - "5601:5601"
    networks: [sre-net]
    depends_on: { opensearch: { condition: service_healthy } }

  fluent-bit:
    image: fluent/fluent-bit:3.0.4
    container_name: fluent-bit
    volumes:
      - ./infra/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infra/fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    networks: [sre-net]
    depends_on: { opensearch: { condition: service_healthy } }

  ollama:
    image: ollama/ollama:0.5.7
    container_name: ollama
    ports: ["11434:11434"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_THREADS=2
    volumes:
      - ollama-data:/root/.ollama
    networks: [sre-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  sre-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sre-api
    ports: ["8001:8000"]
    environment:
      - ES_HOST=http://opensearch:9200
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma:2b}
    networks: [sre-net]
    depends_on:
      opensearch:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [sre-net]
    depends_on: [sre-api]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/monitoring/datasources.yml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    networks: [sre-net]
    depends_on: [prometheus]

networks:
  sre-net: { driver: bridge }

volumes:
  opensearch-data:
  ollama-data:
