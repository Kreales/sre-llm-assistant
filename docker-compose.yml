services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: opensearch
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${ES_PASS}"
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: single-node
      cluster.name: "${OPENSEARCH_CLUSTER_NAME}"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS}"
      bootstrap.memory_lock: "false"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${ES_HOST_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./infra/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    networks: [sre-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: dashboards
    environment:
      - OPENSEARCH_HOSTS=["${ES_HOST}"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_SSL_ENABLED=false
    ports:
      - "${DASHBOARDS_HOST_PORT}:5601"
    networks: [sre-net]
    depends_on: { opensearch: { condition: service_healthy } }

  fluent-bit:
    image: fluent/fluent-bit:3.0.4
    container_name: fluent-bit
    environment:
      FLUENTBIT_OS_HOST: ${FLUENTBIT_OS_HOST}
      FLUENTBIT_OS_PORT: ${FLUENTBIT_OS_PORT}
      FLUENTBIT_OS_INDEX_PREFIX: ${FLUENTBIT_OS_INDEX_PREFIX}
    volumes:
      - ./infra/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infra/fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    networks: [sre-net]
    depends_on: { opensearch: { condition: service_healthy } }

  ollama:
    image: ollama/ollama:0.5.7
    container_name: ollama
    ports: ["${OLLAMA_HOST_PORT}:11434"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_THREADS=${OLLAMA_NUM_THREADS}
    volumes:
      - ollama-data:/root/.ollama
    networks: [sre-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  sre-api:
    image: ${SRE_API_IMAGE:-sre-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sre-api
    ports: ["${API_HOST_PORT}:${API_PORT}"]
    environment:
      - ES_HOST=${ES_HOST}
      - ES_INDEX_PATTERN=${ES_INDEX_PATTERN}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LOG_LEVEL=${LOG_LEVEL}
      - API_PORT=${API_PORT}
      - ANALYZE_MAX_UNIQUE_ERRORS=${ANALYZE_MAX_UNIQUE_ERRORS}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS}
      - LLM_PER_CALL_TIMEOUT_SECONDS=${LLM_PER_CALL_TIMEOUT_SECONDS}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES}
    networks: [sre-net]
    depends_on:
      opensearch:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${API_PORT}/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["${CADVISOR_HOST_PORT}:8080"]
    networks: [sre-net]

  docker-net-exporter:
    image: python:3.10-slim
    container_name: docker-net-exporter
    command: ["python", "/app/docker_net_exporter.py"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-sre-llm-assistant}
      EXPORTER_PORT: "9101"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/docker_net_exporter.py:/app/docker_net_exporter.py:ro
    ports: ["${DOCKER_NET_EXPORTER_PORT}:9101"]
    networks: [sre-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports: ["${PROMETHEUS_HOST_PORT}:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [sre-net]
    depends_on:
      sre-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports: ["${GRAFANA_HOST_PORT}:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/sre-api.json
    volumes:
      - ./infra/monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/monitoring/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana-data:/var/lib/grafana
    networks: [sre-net]
    depends_on: [prometheus]

networks:
  sre-net: { driver: bridge }

volumes:
  opensearch-data:
  ollama-data:
  prometheus-data:
  grafana-data:
