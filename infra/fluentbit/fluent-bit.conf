# Fluent Bit: сбор syslog/файлов + синтетические ERROR-логи → OpenSearch.
[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# Хвостовые логи хоста (если смонтированы в контейнер).
[INPUT]
    Name         tail
    Path         /var/log/syslog,/var/log/*.log
    Parser       syslog
    Tag          host.*
    Refresh_Interval 5

# Синтетический поток для демо без реальных логов приложения.
[INPUT]
    Name         dummy
    Tag          app.synthetic
    Dummy        {"@timestamp":"${NOW}","level":"ERROR","service":"auth-api","pod":"auth-7d4f8b-x9k2","message":"Connection pool exhausted"}
    Rate         1

# Разбор JSON-поля message для app.* тегов.
[FILTER]
    Name         parser
    Match        app.*
    Key_Name     message
    Parser       json
    Reserve_Data On

# Пишем всё в OpenSearch с daily Logstash-индексами (sre-logs-YYYY.MM.DD).
[OUTPUT]
    Name            opensearch
    Match           *
    Host            ${FLUENTBIT_OS_HOST}
    Port            ${FLUENTBIT_OS_PORT}
    Index           ${FLUENTBIT_OS_INDEX_PREFIX}
    Logstash_Format On
    Logstash_Prefix ${FLUENTBIT_OS_INDEX_PREFIX}
    Logstash_DateFormat %Y.%m.%d
    Replace_Dots    On
    Retry_Limit     3
    Suppress_Type_Name On
    Type            _doc
