# Парсеры Fluent Bit для syslog и JSON-логов.
[PARSER]
    Name         syslog
    Format       regex
    # Классический syslog: время, host, ident[pid], message.
    Regex        ^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
    Time_Key     time
    Time_Format  %b %d %H:%M:%S

[PARSER]
    Name         json
    Format       json
    Time_Key     @timestamp
    Time_Format  %Y-%m-%dT%H:%M:%S.%L
