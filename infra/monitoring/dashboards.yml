# Grafana provisioning: автозагрузка дашбордов из JSON-файлов.
apiVersion: 1

providers:
  - name: SRE LLM Assistant
    orgId: 1
    folder: SRE
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30  # как часто перечитывать каталог
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
