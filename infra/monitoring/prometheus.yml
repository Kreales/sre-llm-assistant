# Targets — DNS-имена сервисов из docker-compose (сеть sre-net).
# Порты — внутренние порты контейнеров, не HOST_PORT из .env.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Сам Prometheus (self-monitoring).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики FastAPI (prometheus-fastapi-instrumentator).
  - job_name: sre-api
    metrics_path: /metrics
    static_configs:
      - targets: ["sre-api:8000"]
        labels:
          service: sre-llm-assistant

  # CPU/mem контейнеров.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Сетевые RX/TX по контейнерам (scripts/docker_net_exporter.py).
  - job_name: docker-net
    static_configs:
      - targets: ["docker-net-exporter:9101"]
