global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sre-api
    metrics_path: /metrics
    static_configs:
      - targets: ["sre-api:8000"]
        labels:
          service: sre-llm-assistant
