# Targets — DNS-имена сервисов из docker-compose (сеть sre-net).
# Порты — внутренние порты контейнеров, не HOST_PORT из .env.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sre-api
    metrics_path: /metrics
    static_configs:
      - targets: ["sre-api:8000"]
        labels:
          service: sre-llm-assistant

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: docker-net
    static_configs:
      - targets: ["docker-net-exporter:9101"]
