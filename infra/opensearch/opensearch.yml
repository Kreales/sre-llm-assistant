# Конфиг single-node OpenSearch для локального стека.
# cluster.name задаётся через env в docker-compose (OPENSEARCH_CLUSTER_NAME)
node.name: os-node-1

network.host: 0.0.0.0
http.port: 9200

# memory_lock выключен — в Docker часто нет нужных capabilities.
bootstrap.memory_lock: false

path.data: /usr/share/opensearch/data
path.logs: /usr/share/opensearch/logs

# CORS для Dashboards / локальных скриптов.
http.cors.enabled: true
http.cors.allow-origin: "*"
